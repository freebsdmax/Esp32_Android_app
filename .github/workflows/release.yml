name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build
        run: |
          # local.properties is committed with a Windows path; let Gradle use ANDROID_HOME
          rm -f local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package
        run: |
          mkdir -p out
          TAG="${GITHUB_REF_NAME:-snapshot}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/Ford-Player-${TAG}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

  release:
    name: Publish release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Ford Player — Android app

            **Install**
            ```bash
            adb uninstall com.example.androidplayer
            adb install Ford-Player-*.apk
            ```

            Requirements: Android 8.0+, BLE, notification permission (Android 13+).

            > This is a debug-signed build. See the repository README for release signing.
