name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # "tools" no longer exists in the SDK repository
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/fordplayer-release.jks
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            echo "Keystore restored: $(stat -c%s keystore/fordplayer-release.jks) bytes"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 is not set - building an unsigned debug APK"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f local.properties
          chmod +x gradlew

          TAG="${GITHUB_REF_NAME:-snapshot}"
          VER="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( 10#${MAJ:-0} * 10000 + 10#${MIN:-0} * 100 + 10#${PAT:-0} ))

          if [ "$SIGNED" = "yes" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "task=$TASK version=$VER ($CODE)"
          ./gradlew --no-daemon "$TASK" -PappVersionName="$VER" -PappVersionCode="$CODE"

      - name: Package
        run: |
          mkdir -p out
          TAG="${GITHUB_REF_NAME:-snapshot}"
          if [ "$SIGNED" = "yes" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "out/Ford-Player-${TAG}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

  release:
    name: Publish release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Ford Player — Android app

            **Install**
            ```bash
            adb uninstall com.example.androidplayer
            adb install Ford-Player-*.apk
            ```

            Requirements: Android 8.0+, BLE, notification permission (Android 13+).

            This build is signed with the project release key (if `KEYSTORE_BASE64`
            is configured in the repository secrets; otherwise it is a debug build).
